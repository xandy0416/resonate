# 飞牛 fnOS（Docker）部署配置
# 用法（在 NAS 上本项目目录内）：
#   sudo docker compose up -d --build      # 首次：本地构建
#   sudo docker compose up -d              # 之后：直接起
# 或改用下方已构建好的多架构镜像（CI 自动推到 GHCR，任何人可拉）：
#   image: ghcr.io/xandy0910/resonate:latest
#   （把上面的 build: . 整行删掉，改用 image 那行）

services:
  resonate:
    build: .
    # image: ghcr.io/xandy0910/resonate:latest
    container_name: resonate
    ports:
      - "9982:8787"
    environment:
      - PORT=8787
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    volumes:
      # 持久化网易云登录态：容器内扫码登录后写入，重启不丢。
      # 注意：宿主必须先用 `touch server/.env` 建一个空文件再启动；
      # 否则 Docker 会把缺失的路径建为「目录」，导致登录脚本写入失败。
      - ./server/.env:/app/server/.env:rw
    restart: unless-stopped
