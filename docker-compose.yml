# 飞牛 fnOS（Docker）部署配置
# 默认使用已构建好的多架构镜像（国内镜像源，拉取更快）：
#   sudo docker compose up -d              # 直接拉镜像并启动
# 若需本地构建（需 git clone 完整仓库，含 Dockerfile）：
#   sudo docker compose up -d --build      # 把下方 image 行注释掉、改用 build: .

services:
  resonate:
    # build: .
    image: crpi-279qcm9u4zya3ofn.cn-hangzhou.personal.cr.aliyuncs.com/xandy0416/resonate:latest
    container_name: resonate
    ports:
      - "9982:8787"
    environment:
      - PORT=8787
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      # 服务端落盘根目录（对应容器内路径，需与下方 volumes 挂载一致）。
      # 下载方式选「保存到 NAS」时，文件会直接写入此目录。
      - SAVE_DIR=/data/music
    volumes:
      # 把 NAS 上的音乐目录挂进容器，路径改成你自己的实际目录即可。
      # 例如飞牛共享目录通常在 /vol1/1000/Music，把它映射到容器 /data/music。
      - /vol1/1000/Music:/data/music
    restart: unless-stopped
